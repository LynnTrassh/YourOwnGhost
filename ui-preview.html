<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1210"><title>心里有鬼 · UI 交互预览</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1210}#ui-scene{display:block;width:100%;height:100%;touch-action:none}.preview-dock{position:fixed;z-index:70;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;color:#b9c4b9;font:12px/1.5 system-ui;background:#0a1412dd;padding:6px 10px;border:1px solid #82907844;border-radius:4px}.preview-dock button{font:inherit;background:transparent;color:#dacba5;border:1px solid #c6b48b66;padding:5px 9px;min-height:32px;cursor:pointer}.preview-dock[data-playing=true]{top:12px;bottom:auto}@media(max-width:500px){.preview-dock span{max-width:135px;font-size:10px}}.preview-page .yog-ui .screen{padding-bottom:64px}.preview-dock{display:block}.preview-dock summary{cursor:pointer;min-height:30px;line-height:30px}.preview-dock>div{display:flex;gap:8px;padding-top:6px}</style></head>
<body class="preview-page"><canvas id="ui-scene" aria-label="UI 操作预览卧室"></canvas><details class="preview-dock"><summary><span>预览</span></summary><div><button id="preview-play">试操作</button><button id="preview-home">返回标题</button></div></details><script type="module" src="/src/ui/preview.js"></script></body></html>
