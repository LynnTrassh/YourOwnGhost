<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111817"><title>心里有鬼 · Your Own Ghost</title></head>
<body>
  <canvas id="game" aria-label="第一人称梦境场景"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <header><span>YOUR OWN GHOST</span><span id="location">卧室</span></header>
  <div id="crosshair" hidden aria-hidden="true"></div>
  <p id="prompt" role="status" hidden></p>
  <p id="hint" hidden>W A S D 移动 <i>·</i> 鼠标环顾 <i>·</i> F 手电 <i>·</i> Esc 暂停</p>
  <section id="menu" aria-labelledby="title">
    <div class="panel">
      <p class="eyebrow">A ROOM YOU ALMOST REMEMBER</p>
      <h1 id="title">心里有鬼</h1>
      <p id="description">你醒在一间熟悉的卧室。<br>门外的房间，似乎又换了位置。</p>
      <button id="start">进入梦境 <span>↗</span></button>
      <button id="drag-mode" class="secondary" hidden>使用拖动视角模式</button>
      <button id="restart" class="secondary" hidden>重新开始</button>
      <div class="seed-row"><label for="seed">地图种子</label><input id="seed" maxlength="80" value="42"><button id="apply-seed">应用种子</button></div>
      <div class="actions"><button id="new-seed" class="secondary">换一张地图</button><button id="show-map" class="secondary">查看调试地图</button></div>
      <p id="plan-status"></p>
      <label class="setting">鼠标灵敏度 <input id="sensitivity" type="range" min="0.4" max="2" step="0.1" value="1"></label>
      <label class="setting">VHS 录像质感 <input id="vhs-intensity" type="range" min="0" max="1" step="0.05" value="0.62"></label>
      <label class="setting">极轻镜头微动 <input id="camera-motion" type="checkbox" checked></label>
      <p id="notice">键鼠操作 · 点击后鼠标将锁定，按 Esc 释放<br>当前为探索原型，刷新或重新开始会重置进度。</p>
      <p id="error" role="alert"></p>
    </div>
    <span class="version">随机地图原型 / 02</span>
  </section>
  <section id="map-panel" hidden aria-label="调试地图"><div><button id="close-map">关闭地图</button><h2>空间布局预览</h2><canvas id="map-canvas" aria-label="生成房间与通道平面图"></canvas><p>白点为玩家 · 金色为群体场面预留室 · 绿色为出口<br>当前只验证空间，猫房事件与旁白尚未接入。</p></div></section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
