<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>48间灯光入口检查</title><style>body{margin:16px;background:#141817;color:#d6ddd8;font:14px system-ui}header{display:flex;align-items:center;gap:16px}h1{font-size:18px}select{background:#27352d;color:#fff;padding:7px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0}img{width:100%;display:block}figcaption{padding:6px;font-size:12px}p{font-size:12px;color:#b4beb7}</style><header><h1>48间灯光入口检查</h1><select id="page" aria-label="检查批次"></select><a style="color:#c5d6c9" href="./index.html">实时对照</a></header><p>入口截图初查；六间另有A/B。模型摆放和正式游戏回归由布局对话负责，不代表全房间验收。</p><main id="grid"></main><script type="module">
const data=await(await fetch('./captures/observations.json')).json(),sel=document.querySelector('#page'),grid=document.querySelector('#grid');
for(let i=0;i<6;i++)sel.add(new Option(`${i+1} · ${data.rooms[i*8].id} — ${data.rooms[i*8+7].id}`,i));
function draw(){grid.replaceChildren(...data.rooms.slice(+sel.value*8,+sel.value*8+8).map(r=>{const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=`./captures/${r.id}.jpg`;img.alt=r.id;cap.textContent=`${r.id} · ${r.models}模型 · ${r.lighting.warnings.length?'有锚点警告':'灯位已解析'}`;f.append(img,cap);return f;}));}sel.onchange=draw;draw();
</script></html>
