<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>48间逐房灯光校准</title>
<style>body{margin:0;background:#111;color:#d8d9d1;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:18px;top:18px;width:280px;padding:18px;background:#121817e8;border:1px solid #63756a;border-radius:8px}h1{font-size:18px;margin:0 0 12px}p{line-height:1.6}label{display:block;margin:10px 0}select,button{background:#27312c;color:inherit;border:1px solid #718173;border-radius:4px;padding:6px;margin:3px 0}select{width:100%}#hide{position:fixed;right:16px;top:16px}#badge{position:fixed;bottom:16px;left:18px;background:#121817c9;padding:8px}pre{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:10px}</style>
