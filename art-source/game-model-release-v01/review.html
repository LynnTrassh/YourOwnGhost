<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Tripo 批量模型验收</title><style>body{margin:0;background:#171c1b;color:#ddd;font:14px system-ui}header{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px}button,select{background:#34423d;color:white;padding:8px;border:1px solid #788779}main{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#48564c}article{position:relative;height:300px;background:#202724}canvas{width:100%;height:262px;display:block}label{display:block;padding:3px 8px;font-size:12px}#status{font-size:12px}</style><header><b>真实 GLB / 批量验收</b><select id="pack" aria-label="批次"><option value="props">42 件替换</option><option value="scene">66 件补缺</option></select><select id="page" aria-label="页码"></select><select id="angle" aria-label="视角"><option value="front">正面 −Z</option><option value="side">侧面 +X</option><option value="back">背面 +Z</option><option value="three">立体</option><option value="top">顶部</option></select><span id="status"></span></header><main></main><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
let entries=[],tiles=[],serial=0;const p=document.querySelector('#page'),pack=document.querySelector('#pack'),angle=document.querySelector('#angle'),main=document.querySelector('main'),status=document.querySelector('#status');
function render(t){const size=t.box.getSize(new T.Vector3()),center=t.box.getCenter(new T.Vector3()),dirs={front:[0,.15,-1],side:[1,.15,0],back:[0,.15,1],three:[-.9,.5,-1],top:[0,1,-.001]},d=size.length()/2/Math.sin(T.MathUtils.degToRad(34/2))*1.1;t.camera.position.copy(center).add(new T.Vector3(...dirs[angle.value]).normalize().multiplyScalar(d));t.camera.lookAt(center);t.renderer.render(t.scene,t.camera)}
function release(){for(const t of tiles){const owned=new Set();t.scene.traverse(n=>{if(n.isMesh){owned.add(n.geometry);for(const m of [n.material].flat()){owned.add(m);for(const x of Object.values(m))if(x?.isTexture)owned.add(x)}}});for(const x of owned)x.dispose();t.renderer.dispose();t.renderer.forceContextLoss()}tiles=[];main.replaceChildren()}
async function show(){const ticket=++serial;release();let loaded=0;const list=entries.slice(+p.value*8,+p.value*8+8);status.textContent=`0/${list.length} 加载`;await Promise.all(list.map(async a=>{const el=document.createElement('article'),label=document.createElement('label');label.textContent=a.name;el.append(label);main.append(el);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(el.clientWidth,262);renderer.toneMapping=T.ACESFilmicToneMapping;el.prepend(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#202724');const camera=new T.PerspectiveCamera(34,el.clientWidth/262,.001,40),hemi=new T.HemisphereLight(0xe5e9e8,0x40392f,1.6),light=new T.DirectionalLight(0xffefda,3.3),fill=new T.DirectionalLight(0xa0b5d1,1.6);light.position.set(-3,5,-4);fill.position.set(3,2,3);scene.add(hemi,light,fill);const tile={renderer,scene,camera};tiles.push(tile);try{const g=await new GLTFLoader().loadAsync(a.runtimeUrl);if(ticket!==serial)return;scene.add(g.scene);tile.box=new T.Box3().setFromObject(g.scene);render(tile);label.textContent=`${a.name} · ${a.width.toFixed(2)}×${a.height.toFixed(2)}×${a.depth.toFixed(2)}m`;loaded++;status.textContent=`${loaded}/${list.length} 加载完成`;el.dataset.asset=a.id}catch(e){label.textContent=a.name+' 加载失败';console.error(e)}}))}
async function load(){const path='/art-source/game-model-release-v01/candidates.json';entries=(await(await fetch(path,{cache:'no-store'})).json()).models;p.replaceChildren();for(let i=0;i<Math.ceil(entries.length/8);i++){const o=document.createElement('option');o.value=i;o.textContent=`${i*8+1}–${Math.min(i*8+8,entries.length)}`;p.append(o)}show()}
p.onchange=show;pack.onchange=load;angle.onchange=()=>tiles.forEach(t=>{if(t.box)render(t)});load();
</script></html>
