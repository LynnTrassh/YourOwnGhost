<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家具模型 · 模型检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171b1b;color:#ede8dc;font:14px/1.6 system-ui,sans-serif}header{position:fixed;inset:0 0 auto;padding:20px 26px;z-index:2;background:#171b1bf2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:22px;font-weight:500;margin:0 20px 0 0}button,select,a{font:inherit;color:inherit;background:#293332;border:1px solid #52635e;border-radius:5px;padding:7px 12px;text-decoration:none}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #d0b990}#viewport{position:fixed;inset:104px 0 100px}footer{position:fixed;bottom:18px;left:26px;right:26px;color:#b2bdb6}#status{color:#e0d7c1}small{font-size:12px}canvas{display:block}@media(max-width:700px){#viewport{top:180px}header{padding:12px;gap:5px}h1{width:100%}footer{left:12px}}
</style></head><body><header><h1>桌面穿插检查</h1><select id="asset" aria-label="模型"></select><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="three">立体</button><button data-view="top">顶部</button><select id="light" aria-label="灯光"><option value="neutral">中性检查</option><option value="room">旧屋暗光</option></select><a id="download" download>下载 GLB</a><select id="dressing" aria-label="桌面补充"><option value="after">修复后</option><option value="before">修复前</option><option value="none">仅原模型</option></select></header><main id="viewport"></main><footer><div id="status" role="status">等待导出模型…</div><small>拖拽旋转 · 滚轮缩放 · 网格每格 10 cm · 原始书桌 GLB 与额外桌面陈设对照；不包含房间后处理</small></footer>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createRoomDetailDressing as after} from '/src/art/room-detail-dressing.js';
import {createRoomDetailDressing as before} from './baseline/room-detail-dressing.js';
import {INTERIOR_ASSETS} from '/src/art/interior-catalog.js';
import {createInteriorModelLoader} from '/src/art/interior-models.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const viewport=document.querySelector('#viewport'),status=document.querySelector('#status'),select=document.querySelector('#asset');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(viewport.clientWidth,viewport.clientHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;viewport.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#171b1b');
const camera=new THREE.PerspectiveCamera(36,viewport.clientWidth/viewport.clientHeight,.005,20);
const controls=new OrbitControls(camera,renderer.domElement);controls.minDistance=.08;controls.maxDistance=10;
const hemi=new THREE.HemisphereLight(0xe5e9e8,0x40392f,1.5),key=new THREE.DirectionalLight(0xffefda,3),fill=new THREE.DirectionalLight(0xa0b5d1,1.1);key.position.set(-3,5,-4);fill.position.set(3,2,3);scene.add(hemi,key,fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshStandardMaterial({color:0x292e2b,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);
const grid=new THREE.GridHelper(2,20,0x687269,0x3c4942);grid.position.y=-.003;scene.add(grid);
let model,catalog,serial=0,view='three',size=new THREE.Vector3(.4,.5,.3),center=new THREE.Vector3(0,.25,0),pending=false;
function render(){if(pending||document.hidden)return;pending=true;requestAnimationFrame(()=>{pending=false;renderer.render(scene,camera)});}
function frame(next=view){view=next;const r=size.length()/2,d=r/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*Math.max(1,1/camera.aspect)*1.1;const dirs={front:[0,.1,-1],side:[1,.1,0],back:[0,.1,1],three:[-.85,.45,-1],top:[0,1,-.001]};camera.position.copy(center).add(new THREE.Vector3(...dirs[view]).normalize().multiplyScalar(d));controls.target.copy(center);controls.update();render();}
function dispose(obj){const set=new Set();obj.traverse(n=>{if(n.isMesh){set.add(n.geometry);for(const m of [n.material].flat()){set.add(m);for(const x of Object.values(m))if(x?.isTexture)set.add(x)}}});for(const x of set)x.dispose();obj.removeFromParent();}
let resources=new Set();
async function show(){const ticket=++serial;for(const r of resources)r.dispose();resources=new Set();if(model)model.removeFromParent();model=new THREE.Group();scene.add(model);const id=select.value,a=INTERIOR_ASSETS[id];status.textContent='加载中';const loader=createInteriorModelLoader(resources);const w=a.width,d=a.depth,h=a.height;
const group=await loader.attach(id,{parent:model,width:w,depth:d,height:h});if(ticket!==serial)return;
const mode=document.querySelector('#dressing').value;
if(mode!=='none'){const dressing=(mode==='before'?before:after)({plan:{rooms:[{id:'inspect',interior:{presetId:'archive'}}]},root:model,resources});dressing.furnish({id,anchor:model,model:group,width:w,depth:d,height:h,obstacle:{id:'desk',roomId:'inspect',prefabId:a.prefabId,height:1.1}});}
new THREE.Box3().setFromObject(model).getSize(size);new THREE.Box3().setFromObject(model).getCenter(center);status.textContent=mode+' · '+id;document.querySelector('#download').href=a.url;frame();}
document.querySelector('#dressing').addEventListener('change',show);
select.addEventListener('change',show);for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>frame(b.dataset.view));document.querySelector('#light').addEventListener('change',e=>{const room=e.target.value==='room';hemi.intensity=room?.35:1.5;key.color.set(room?0xffc38a:0xffefda);key.intensity=room?2:3;fill.intensity=room?.45:1.1;render()});controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=viewport.clientWidth/viewport.clientHeight;camera.updateProjectionMatrix();renderer.setSize(viewport.clientWidth,viewport.clientHeight);frame()});addEventListener('visibilitychange',render);addEventListener('pagehide',()=>{if(model)dispose(model);controls.dispose();renderer.dispose()});
for(const id of ['furniture-writing-desk','furniture-document-table','furniture-coffee-table','furniture-nightstand','furniture-dresser','furniture-offering-table']){if(!INTERIOR_ASSETS[id])continue;const o=document.createElement('option');o.value=id;o.textContent=id;select.append(o)}await show();render();
</script></body></html>
