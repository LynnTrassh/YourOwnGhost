<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全主题道具库</title><style>body{margin:0;background:#171b1b;color:#e4dccb;font:14px system-ui}header{height:70px;display:flex;align-items:center;gap:18px;padding:0 24px}h1{font-size:20px}button,select,a{background:#303831;color:inherit;border:1px solid #6b7569;padding:8px;text-decoration:none}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px}article{height:275px;position:relative;background:#232b29;border:1px solid #4a5650}article p{position:absolute;bottom:0;left:15px;pointer-events:none;margin:10px 0}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#status{font-size:12px}header,#cards{position:relative;z-index:1}header{background:#171b1b}article{background:transparent}</style><canvas></canvas><header><h1>全主题道具库 / 42 件</h1><select id="page" aria-label="资产批次"><option value="0">电器与衣帽</option><option value="1">收纳与生活</option><option value="2">医疗与童年</option><option value="3">仪式与异常</option><option value="4">线缆与家具组合</option><option value="5">组合补充</option></select><a href="models.html">单件旋转检查</a><span id="status">加载…</span></header><main id="cards"></main><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;
const manifest=await (await fetch('/art/room-props/v01/manifest.json')).json(),cache=new Map(),loader=new GLTFLoader();let scenes=[],serial=0;
async function show(){const token=++serial;scenes=[];const selected=manifest.models.slice(Number(page.value)*8,Number(page.value)*8+8);document.querySelector('#cards').replaceChildren();status.textContent='加载…';for(const a of selected){const cell=document.createElement('article'),p=document.createElement('p');p.textContent=a.name+' · '+a.triangles+' 面';cell.append(p);document.querySelector('#cards').append(cell);const scene=new T.Scene();scene.background=new T.Color('#242c29');scene.add(new T.HemisphereLight(0xf5ecdb,0x63594d,2));const key=new T.DirectionalLight(0xffe8d0,3);key.position.set(-3,4,-4);scene.add(key);if(!cache.has(a.id))cache.set(a.id,await loader.loadAsync(a.runtimeUrl));scene.add(cache.get(a.id).scene.clone(true));const size=new T.Vector3(a.width,a.height,a.depth),center=new T.Vector3(0,a.height/2,0),camera=new T.PerspectiveCamera(36,1,.001,30),distance=size.length()/2/Math.sin(Math.PI/10)*1.2;camera.position.copy(center).add(new T.Vector3(-.85,.5,-1).normalize().multiplyScalar(distance));camera.lookAt(center);scenes.push({scene,camera,cell});if(token!==serial)return;}document.querySelector('#status').textContent=`本页 ${scenes.length} 件已加载`;render();}
function render(){renderer.setSize(innerWidth,innerHeight,false);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const {scene,camera,cell} of scenes){const r=cell.getBoundingClientRect(),h=r.height-38;camera.aspect=r.width/h;camera.updateProjectionMatrix();renderer.setViewport(r.left,innerHeight-r.top-h,r.width,h);renderer.setScissor(r.left,innerHeight-r.top-h,r.width,h);renderer.render(scene,camera);}}
const page=document.querySelector('#page'),status=document.querySelector('#status');page.addEventListener('change',show);addEventListener('resize',render);addEventListener('scroll',render);await show();
</script></html>
