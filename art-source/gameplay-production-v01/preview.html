<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正式资产 · 造型预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #171818; color: #e6dfd1; font: 14px/1.6 system-ui, sans-serif; }
    canvas { display: block; }
    #viewport { position: fixed; inset: 130px 0 64px; }
    header { position: fixed; top: 24px; left: 28px; z-index: 1; pointer-events: none; }
    h1 { margin: 4px 0; font-size: 23px; font-weight: 500; }
    .eyebrow { color: #a9a398; font-size: 11px; letter-spacing: .16em; }
    #status { color: #bdb7aa; font-size: 12px; max-width: min(480px, 90vw); }
    nav { position: fixed; right: 28px; top: 28px; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; max-width: 300px; }
    button, select { border: 1px solid #58594f; border-radius: 5px; background: #262824; color: #e6dfd1; padding: 7px 11px; font: inherit; cursor: pointer; }
    button:hover { background: #3b3e36; }
    button:focus-visible, select:focus-visible { outline: 2px solid #e1c395; outline-offset: 2px; }
    footer { position: fixed; bottom: 22px; left: 28px; color: #a9a398; font-size: 12px; pointer-events: none; }
    @media (max-width: 760px) { nav { top: 124px; left: 28px; right: auto; } h1 { font-size: 20px; } #viewport { top: 178px; } footer { right: 20px; bottom: 12px; } }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">YOUR OWN GHOST / ANIMAL LIBRARY</div>
    <h1>常见动物资产</h1>
    <div id="status" role="status">正在加载 Tripo 模型…</div>
  </header>
  <nav aria-label="预览控制">
    <select id="asset" aria-label="资产"><option value="animal=cat-tabby">猫</option><option value="animal=dog-brown">狗</option><option value="animal=rabbit-ivory">兔子</option><option value="animal=pigeon-gray-v3">鸽子</option><option value="animal=mouse-brown-v3">老鼠</option><option value="prop=control-cabinet">配电台</option><option value="prop=ceramic-fuse">保险丝</option><option value="prop=watcher-effigy">默认窥视者</option><option value="prop=dry-flower-vase">枯花花瓶</option></select>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="side">侧面</button>
    <button type="button" data-view="back">背面</button>
    <select id="light" aria-label="灯光"><option value="neutral">中性检查</option><option value="warm">旧屋暖光</option></select>
  </nav>
  <main id="viewport" aria-label="可旋转的三维模型"></main>
  <footer>拖拽旋转 · 滚轮缩放 · 静态模型 · 已接入对应预设／道具位置 · 无骨骼动画</footer>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const picker=document.querySelector('#asset');picker.value=location.search.slice(1)||'animal=cat-tabby';picker.addEventListener('change',()=>{location.search=picker.value;});
    document.querySelector('h1').textContent=picker.selectedOptions[0]?.textContent||'正式资产';
    const status = document.querySelector('#status');
    const viewport = document.querySelector('#viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    viewport.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#171818');
    const camera = new THREE.PerspectiveCamera(36, viewport.clientWidth / viewport.clientHeight, 0.02, 100);
    camera.position.set(2.3, 1.65, -4.2);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.03, 0);
    controls.enableDamping = true;
    controls.minDistance = 0.35;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;
    let modelSize = new THREE.Vector3(1, 1.98, 1);
    let currentView = 'front';
    function frameModel(view = currentView) {
      currentView = view;
      const distance = 1.25 * Math.max(modelSize.y, Math.max(modelSize.x, modelSize.z) / camera.aspect) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) + Math.max(modelSize.x, modelSize.z) / 2;
      const poses = { front: [0, modelSize.y / 2 + .03, -distance], side: [distance, modelSize.y / 2 + .03, 0], back: [0, modelSize.y / 2 + .03, distance] };
      camera.position.set(...poses[view]);
      controls.target.set(0, modelSize.y / 2, 0);
      controls.update();
    }

    const ambient = new THREE.HemisphereLight(0xe5eaf0, 0x42382d, 1.5);
    const key = new THREE.DirectionalLight(0xffeed7, 3);
    key.position.set(-3, 5, -4);
    const fill = new THREE.DirectionalLight(0x9db4cc, 1.3);
    fill.position.set(3, 2, 3);
    scene.add(ambient, key, fill);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x292a27, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.005;
    scene.add(floor);
    const grid = new THREE.GridHelper(6, 12, 0x4c4b41, 0x353630);
    grid.position.y = -0.002;
    scene.add(grid);

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    loader.load(`/art/${new URLSearchParams(location.search).has('prop')?'gameplay-production-v01':'animals-v01'}/${new URLSearchParams(location.search).get('prop')||new URLSearchParams(location.search).get('animal')||'cat-tabby'}.glb`, gltf => {
      const root = gltf.scene;
      if(new URLSearchParams(location.search).has('double'))root.traverse(n=>{for(const m of n.material?(Array.isArray(n.material)?n.material:[n.material]):[])m.side=THREE.DoubleSide;});
      scene.add(root);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      modelSize.copy(size);
      frameModel();
      let triangles = 0;
      root.traverse(node => {
        if (node.isMesh) triangles += (node.geometry.index?.count ?? node.geometry.attributes.position.count) / 3;
      });
      status.textContent = `Tripo P1 · ${Math.round(triangles).toLocaleString()} 三角面 · ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m · ${gltf.animations.length} 个动画片段`;
      document.body.dataset.modelLoaded = 'true';
    }, undefined, error => {
      status.textContent = '模型加载失败，请确认模型已导出并通过 Vite 打开本页。';
      console.error(error);
      document.body.dataset.modelLoaded = 'error';
    });
    for (const button of document.querySelectorAll('[data-view]')) {
      button.addEventListener('click', () => {
        frameModel(button.dataset.view);
      });
    }
    document.querySelector('#light').addEventListener('change', event => {
      const warm = event.target.value === 'warm';
      ambient.intensity = warm ? 0.45 : 1.5;
      key.color.set(warm ? 0xffce91 : 0xffeed7);
      key.intensity = warm ? 2.7 : 3;
      fill.intensity = warm ? 0.5 : 1.3;
    });
    addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      frameModel();
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
