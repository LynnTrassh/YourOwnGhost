<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六主题 · 48间制作布局</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#121713;color:#e2e3d8}*{box-sizing:border-box}body{margin:0}header{padding:25px 30px;border-bottom:1px solid #3b463c;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-weight:500;font-size:25px;margin:5px 0}small,.muted{color:#a4b3a4}a{color:#d2dbb2}button,select{font:inherit;background:#202b23;color:inherit;border:1px solid #51624f;border-radius:4px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#d0dab9;color:#19221c}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 30px}main{display:grid;grid-template-columns:220px minmax(360px,1fr) 390px;gap:22px;padding:0 30px 30px}#rooms{display:grid;align-content:start;gap:8px}#rooms button{text-align:left;font-size:12px}#rooms b{display:block;margin-bottom:4px;font-size:14px}section{min-width:0}.map{border:1px solid #3b463c;background:#182019;border-radius:8px;padding:14px}svg{width:100%;max-height:540px}svg text{font-family:system-ui;fill:#e6eadf}svg .item{cursor:pointer}svg .item:hover rect{stroke:#fff;stroke-width:2.5}.legend{font-size:12px;display:flex;gap:18px;margin:12px 0;color:#b2c2b5}p{font-size:14px;line-height:1.8}h2{margin:4px 0 12px;font-weight:500}h3{font-size:14px;font-weight:600;margin:22px 0 8px;color:#cbd7bd}ol,ul{padding-left:20px;font-size:13px;line-height:1.8}#meta{font-size:12px;line-height:1.8;color:#b1bfae}.notice{background:#2c2b20;border:1px solid #665b39;padding:10px 13px;margin-bottom:14px;color:#e1cf9b;font-size:12px;line-height:1.7}#assets{max-height:300px;overflow:auto}#assets button{padding:3px 7px;font-size:11px;margin:2px}#selected{min-height:44px;font-size:12px;color:#e3d29d}.badge{color:#e7b47d}#summary{font-size:12px;max-width:480px;line-height:1.7}footer{border-top:1px solid #3b463c;margin-top:15px;padding-top:10px;font-size:11px;color:#9caf9f}@media(max-width:1100px){main{grid-template-columns:180px 1fr}#brief{grid-column:1/-1}}@media(max-width:650px){main{display:block;padding:14px}#rooms{grid-template-columns:1fr 1fr;margin-bottom:18px}header{display:block;padding:14px}nav{padding:14px}}
</style><header><div><small>YOUR OWN GHOST / ENVIRONMENT ART</small><h1>六主题 · 48间制作布局</h1></div><div id="summary"></div></header><nav id="themes" aria-label="主题"></nav><main><section id="rooms" aria-label="房间"></section><section><h2 id="title"></h2><div id="meta"></div><div class="legend"><span>实线：已有文件</span><span class="badge">虚线：待交付模型的预留占地</span></div><div class="map"><svg id="plan" viewBox="0 0 560 560" aria-label="带编号物件、入口和观察点的房间布局图"></svg></div><div id="selected">点击物件查看编号、坐标、尺寸和资产。</div><div id="assets"></div><footer>图中为确定性制作布局。尺寸来自交付包围盒或明确标注的设计预留包围盒；新模型到位后须重验。平面通行检查不代替正式游戏导航和事件验收。</footer></section><section id="brief"><div class="notice" id="state"></div><div id="detail"></div><p><a id="preview" target="_blank">打开当前3D实景对照 ↗</a></p><p><a href="layouts.json">完整布局数据</a> · <a href="layout-checks.json">48间静态检查</a></p></section></main><script type="module">
const pack=await (await fetch('./layouts.json')).json(),$=id=>document.getElementById(id),themes=[['hospital','医院'],['park','游乐场'],['office','公司'],['home','个人住宅'],['hotel','旅馆'],['ritual','祭祀空间']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=pack.rooms.find(r=>r.id===location.hash.slice(1))??pack.rooms[0];
$('summary').textContent=`6 × 8 = 48间 · 每间有具体物件坐标、功能分组与发现路线。当前清单中${pack.summary.roomsWithAllListedFiles}间的核心依赖有文件，${pack.summary.roomsMissingFiles}间还缺文件；均不自动等同视觉验收。`;
for(const [id,name]of themes){const b=document.createElement('button');b.textContent=name;b.dataset.theme=id;b.onclick=()=>select(pack.rooms.find(r=>r.theme===id));$('themes').append(b);}
function select(r){current=r;history.replaceState(null,'','#'+r.id);for(const b of $('themes').children)b.setAttribute('aria-pressed',b.dataset.theme===r.theme);$('rooms').replaceChildren();
 for(const entry of pack.rooms.filter(x=>x.theme===r.theme)){const b=document.createElement('button');b.innerHTML=`<b>${esc(entry.id.slice(-2)+' '+entry.name)}</b><span>${entry.dimensions[0]}×${entry.dimensions[2]}米 · ${entry.layout.placements.length}件${entry.missingAssets.length?' · 缺'+entry.missingAssets.length+'类':' · 文件已齐'}</span>`;b.setAttribute('aria-pressed',entry.id===r.id);b.onclick=()=>select(entry);$('rooms').append(b);}
 $('title').textContent=r.id+' / '+r.name;$('meta').textContent=`${r.normalFunction} · 强度L${r.intensity} · 实体天花3米 · +Z入口 · 静态0.6米玩家通行检查通过`;
 $('state').textContent=r.missingAssets.length?`布局已明确；${r.missingAssets.length}类核心模型尚未进入本快照。虚线只表示制作预留位置，不能用替代柜子冒充成品。`:'本方案所列核心资产已有文件。实景仍须核对朝向、支撑、材质、机位及性能，未标为正式游戏已完成。';
 const fields=[['主功能组',r.hero],['辅助分组',r.secondaryGroups.join('；')],['构图与疏密',r.composition],['发现过程',r.reveal],['天花',r.ceiling],['光照',r.lighting]];$('detail').innerHTML=fields.map(([k,v])=>`<h3>${k}</h3><p>${esc(v)}</p>`).join('')+'<h3>四个观察环节</h3><ol>'+r.discoveryShots.map(v=>`<li>${esc(v.name+'：'+v.action)}</li>`).join('')+'</ol>';
 $('preview').href=`../index.html#${r.id}`;$('selected').textContent='点击物件查看编号、坐标、尺寸和资产。';
 const [w,,d]=r.dimensions,scale=450/Math.max(w,d),px=x=>280+x*scale,pz=z=>280+z*scale;
 let svg=`<defs><pattern id="grid" width="${scale}" height="${scale}" patternUnits="userSpaceOnUse"><path d="M ${scale} 0 L 0 0 0 ${scale}" fill="none" stroke="#354136" stroke-width=".6"/></pattern></defs><rect x="${px(-w/2)}" y="${pz(-d/2)}" width="${w*scale}" height="${d*scale}" fill="url(#grid)" stroke="#9caa92" stroke-width="3"/><path d="M ${px(-.7)} ${pz(d/2)} H ${px(.7)}" stroke="#142219" stroke-width="5"/><text x="280" y="${pz(d/2)+24}" text-anchor="middle" font-size="13">入口 +Z · 净宽1.4m</text>`;
 $('assets').replaceChildren();
 r.layout.placements.forEach((p,i)=>{const b=p.bounds,fill=p.asset.available?'#69886b':'#936845',opacity=(p.supportId||p.supportKey)?.3:.65;svg+=`<g class="item" data-index="${i}"><rect x="${px(b.minX)}" y="${pz(b.minZ)}" width="${(b.maxX-b.minX)*scale}" height="${(b.maxZ-b.minZ)*scale}" fill="${fill}" fill-opacity="${opacity}" stroke="${p.asset.available?'#a2c39a':'#edb57e'}" stroke-dasharray="${p.asset.available?'0':'4 3'}"/><text x="${px(p.x)}" y="${pz(p.z)+4}" text-anchor="middle" font-size="10">${i+1}</text><title>${esc(p.asset.name+' / '+p.group)}</title></g>`;const btt=document.createElement('button');btt.textContent=`${i+1} ${p.asset.name}`;btt.onclick=()=>inspect(i);$('assets').append(btt);});
 svg+=`<circle cx="280" cy="${pz(d/2-.65)}" r="6" fill="#d8dfbf"/><text x="292" y="${pz(d/2-.65)+4}" font-size="11">入口视点</text>`;$('plan').innerHTML=svg;$('plan').querySelectorAll('.item').forEach(n=>n.onclick=()=>inspect(Number(n.dataset.index)));
}
function inspect(index){const p=current.layout.placements[index];$('selected').textContent=`${index+1} / ${p.asset.name} · ${p.group} · X ${p.x.toFixed(2)} / Y ${p.y.toFixed(2)} / Z ${p.z.toFixed(2)}m · 朝向${p.yaw}° · W/H/D ${p.asset.size.map(n=>n.toFixed(2)).join('/')}m · ${p.asset.boundsSource==='delivered-bounds'?'交付尺寸':'设计预留尺寸'} · ${p.assetId}${p.supportId?' · 支撑 '+p.supportId:''}`;}
select(current);
</script></html>
