es/hospital-06-1793428409698.png" loading="lazy"></a><figcaption>06 · 值班休息室<small>侧床、靠墙沙发与低桌构成有人生活过的角落。</small></figcaption></figure><figure><a href="captures/hospital-07-1793428409845.png" target="_blank"><img src="captures/hospital-07-1793428409845.png" loading="lazy"></a><figcaption>07 · 病案封存库<small>双列病案柜与断开的工作岛；一条阅读路径。</small></figcaption></figure><figure><a href="captures/hospital-08-1793428409987.png" target="_blank"><img src="captures/hospital-08-1793428409987.png" loading="lazy"></a><figcaption>08 · 遗留物保管室<small>正面陈列柜、左侧床与右侧空白墙构成不均衡。</small></figcaption></figure></div></section><section id="park"><h2>游乐场 / 8间</h2><div class="grid"><figure><a href="captures/park-01-1793428410192.png" target="_blank"><img src="captures/park-01-1793428410192.png" loading="lazy"></a><figcaption>01 · 闭园售票室<small>双柜台错位，售票员椅子退入侧后方。</small></figcaption></figure><figure><a href="captures/park-02-1793428410352.png" target="_blank"><img src="captures/park-02-1793428410352.png" loading="lazy"></a><figcaption>02 · 无人领奖台<small>三柜形成后方展带，儿童桌退至一侧。</small></figcaption></figure><figure><a href="captures/park-03-1793428410505.png" target="_blank"><img src="captures/park-03-1793428410505.png" loading="lazy"></a><figcaption>03 · 雨天手工教室<small>三张小桌错落组成斜线，教具集中一侧。</small></figcaption></figure><figure><a href="captures/park-04-1793428410645.png" target="_blank"><img src="captures/park-04-1793428410645.png" loading="lazy"></a><figcaption>04 · 走失儿童等候室<small>两侧成人座位围住低矮玩具区，后墙保留空缺。</small></figcaption></figure><figure><a href="captures/park-05-1793428410853.png" target="_blank"><img src="captures/park-05-1793428410853.png" loading="lazy"></a><figcaption>05 · 演员化妆间<small>两面梳妆镜不对称，衣柜占据一侧后景。</small></figcaption></figure><figure><a href="captures/park-06-1793428410979.png" target="_blank"><img src="captures/park-06-1793428410979.png" loading="lazy"></a><figcaption>06 · 旧奖品仓<small>两侧高低储物错位，尽头儿童桌被大柜夹住。</small></figcaption></figure><figure><a href="captures/park-07-1793428411107.png" target="_blank"><img src="captures/park-07-1793428411107.png" loading="lazy"></a><figcaption>07 · 闭园员工室<small>一边用餐一边休息，中央留出大片空地。</small></figcaption></figure><figure><a href="captures/park-08-1793428411243.png" target="_blank"><img src="captures/park-08-1793428411243.png" loading="lazy"></a><figcaption>08 · 帷幕后等候厅<small>错位座椅面向封闭帷幕，角落只留一个陈列柜。</small></figcaption></figure></div></section><section id="office"><h2>公司 / 8间</h2><div class="grid"><figure><a href="captures/office-01-1793428411378.png" target="_blank"><img src="captures/office-01-1793428411378.png" loading="lazy"></a><figcaption>01 · 无人前台<small>单张前台桌偏左，右侧接待席，后景密集柜墙。</small></figcaption></figure><figure><a href="captures/office-02-1793428411506.png" target="_blank"><img src="captures/office-02-1793428411506.png" loading="lazy"></a><figcaption>02 · 夜班工位<small>四个侧向工作位，尽头唯一一张桌子面向来人。</small></figcaption></figure><figure><a href="captures/office-03-1793428411644.png" target="_blank"><img src="captures/office-03-1793428411644.png" loading="lazy"></a><figcaption>03 · 裁撤会议室<small>三张文件桌接成纵轴，座椅集中左侧，右侧空缺。</small></figcaption></figure><figure><a href="captures/office-04-1793428411774.png" target="_blank"><img src="captures/office-04-1793428411774.png" loading="lazy"></a><figcaption>04 · 封存档案室<small>两侧档案墙与尽头孤立文件桌，形成狭长透视。</small></figcaption></figure><figure><a href="captures/office-05-1793428411908.png" target="_blank"><img src="captures/office-05-1793428411908.png" loading="lazy"></a><figcaption>05 · 合伙人办公室<small>斜向观看的宽阔书桌，后墙书柜与侧面会客区。</small></figcaption></figure><figure><a href="captures/office-06-1793428412053.png" target="_blank"><img src="captures/office-06-1793428412053.png" loading="lazy"></a><figcaption>06 · 收发登记室<small>前方交接桌与后方双柜错位；左边候取区。</small></figcaption></figure><figure><a href="captures/office-07-1793428412192.png" target="_blank"><img src="captures/office-07-1793428412192.png" loading="lazy"></a><figcaption>07 · 离职面谈室<small>桌子在右，低沙发在左，背后只有一组孤立档案柜。</small></figcaption></figure><figure><a href="captures/office-08-1793428412321.png" targ
