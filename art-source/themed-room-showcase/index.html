</style><canvas id="view" aria-label="可拖动观察的恐怖房间三维实景"></canvas><aside id="panel"><div class="eyebrow">YOUR OWN GHOST · ART LIBRARY</div><h1>异室档案</h1><a href="./production/index.html" target="_blank">48间完整布局与模型清单 ↗</a><label for="theme">六个主题</label><select id="theme"></select><label for="room">每个主题八间</label><select id="room"></select><div class="row"><button id="prev">上一间</button><button id="next">下一间</button></div><p id="composition"></p><small id="reveal"></small><div class="row"><button id="entry">入口机位</button><button id="ceiling">抬头看天花</button></div><div class="row"><button id="walk">进入漫游</button><button id="tour">慢速观景</button></div><div class="row"><button id="sequence">连续展映 48 间</button><button id="hide">隐藏界面 H</button></div><label><input type="checkbox" id="flash" checked> 原版窄束手电 F</label><label for="camera">摄影机画质</label><select id="camera"><option value="subtle">正常探索 · 微弱缺陷</option><option value="off">关闭画质缺陷</option><option value="reference">参考强度</option></select><details><summary>叙事故障 / 记录与检查</summary><p>空间、摄影机与信号分别控制；默认没有信号故障。局部故障只供策划按叙事调用。</p><button id="signal">焦点局部失真 1 秒</button><div class="row"><button id="capture">保存当前画面</button><button id="audit">核验并记录48间</button></div><pre id="data"></pre></details><p id="status" role="status">加载实景模型…</p><small id="help">拖动画面观察 · WASD 移动 · Q/E 换房 · F 手电 · H 隐藏/显示 · Esc 退出鼠标锁定。<br>制作布局 V2 · 已读取同期模型交付。正式地图接入待策划/程序方完成。</small></aside><button id="corner">H · 隐藏界面</button><div id="caption"><span id="code"></span><b id="name"></b></div><div id="loading">正在布置房间…</div><script type="module" src="./preview.js"></script></html>
