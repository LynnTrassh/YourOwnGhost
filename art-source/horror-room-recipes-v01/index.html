<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恐怖组合预设 · 旧电脑录入室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101713;color:#d1d8cc;font:14px/1.5 system-ui}header{position:fixed;top:0;width:100%;padding:16px 24px;background:#152019ee;display:flex;gap:12px;align-items:center;z-index:2;flex-wrap:wrap}h1{font-size:19px;margin:0 14px 0 0}button,select,a{font:inherit;color:inherit;background:#25372d;border:1px solid #516556;border-radius:4px;padding:6px 10px}button{cursor:pointer}#view{height:100vh}canvas{display:block}footer{position:fixed;bottom:16px;left:24px;background:#142018ed;max-width:650px;padding:14px 18px;pointer-events:none}#status{color:#e3c891}small{color:#a0afa0}details{position:fixed;right:20px;bottom:20px;background:#142018;padding:12px;max-width:45vw;max-height:55vh;overflow:auto}pre{font-size:11px;white-space:pre-wrap}a{text-decoration:none}</style>
<header><h1>恐怖组合 / 旧电脑录入室</h1><select id="variant" aria-label="恐怖状态"><option value="night">深夜值班</option><option value="sync">全屏同步</option><option value="blind">尽头黑屏</option></select><select id="size" aria-label="房间规模"><option value="small">10 × 10 m / 8 工位</option><option value="large">15 × 15 m / 16 工位</option><option value="single">单台电脑适配</option></select><button data-pose="entry">入口</button><button data-pose="close">走近</button><button data-pose="reverse">回望</button><label><input id="flash" type="checkbox" checked>手电</label><select id="signal" aria-label="屏幕画面"><option value="auto">自动循环</option><option value="ue5">UE5</option><option value="snow">雪花</option><option value="unity">Unity</option><option value="tear">撕裂花屏</option><option value="gpt">GPT</option><option value="black">黑屏</option></select><button id="pause">暂停播放</button><label><input id="exception" type="checkbox">一台停在 Unity</label><button id="export">导出预设 JSON</button></header><main id="view"></main><footer><div id="status" role="status">加载预设…</div><div id="intent"></div><div id="playback-status"></div><small>拖动环顾 · 固定站立机位 · 这是独立组合样板，尚未分配到游戏房间</small></footer><details><summary>策划参数与占位</summary><pre id="report"></pre></details><script type="module" src="./preview.js"></script></html>
