<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Own Ghost · found-footage room study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0c0d0b; color: #d4d0c1; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    header { position: fixed; z-index: 2; top: 0; left: 0; right: 0; padding: 17px 20px; display: flex; justify-content: space-between; letter-spacing: .13em; text-transform: uppercase; text-shadow: 0 1px 4px #000; pointer-events: none; }
    header a { color: #d4d0c1; pointer-events: auto; }
    #caption { position: fixed; left: 20px; bottom: 18px; letter-spacing: .04em; color: #b0ac9d; text-shadow: 0 1px 5px #000; pointer-events: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <header><span>YOUR OWN GHOST · FOUND FOOTAGE STUDY</span><a href="/art-source/preview.html">查看单体资产 ↗</a></header>
  <div id="caption">拖拽环顾 · 手电压在门口的东西上 · 本页为美术预览，未接入游戏剧情</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createVhsEffect } from '/src/art/vhs-effect.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#11120f');
    scene.fog = new THREE.FogExp2('#11120f', .045);
    const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, .06, 45);
    camera.position.set(0, 1.57, 2.3);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, -3.5);
    controls.enableDamping = true;
    controls.dampingFactor = .045;
    controls.minDistance = 1.3;
    controls.maxDistance = 5.8;
    controls.maxPolarAngle = Math.PI * .48;

    function plasterTexture() {
      const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#716960'; ctx.fillRect(0, 0, 512, 512);
      let seed = 29;
      const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      for (let i = 0; i < 260; i++) {
        const x = rand() * 512, y = rand() * 512, r = 8 + rand() * 68;
        ctx.fillStyle = rand() > .48 ? `rgba(24,22,19,${.025 + rand()*.075})` : `rgba(207,190,157,${.025 + rand()*.06})`;
        ctx.beginPath(); ctx.ellipse(x, y, r, r * (.25 + rand()*.65), rand(), 0, Math.PI * 2); ctx.fill();
      }
      for (let i = 0; i < 8000; i++) {
        const v = rand() > .5 ? 235 : 22;
        ctx.fillStyle = `rgba(${v},${v-4},${v-8},${rand()*.11})`;
        ctx.fillRect(rand()*512, rand()*512, 1+rand()*2, 1+rand()*2);
      }
      // Water damage collects at the floor and in several thin, irregular cracks.
      const damp = ctx.createLinearGradient(0, 300, 0, 512);
      damp.addColorStop(0, 'rgba(39,35,30,0)'); damp.addColorStop(1, 'rgba(31,29,26,.62)');
      ctx.fillStyle = damp; ctx.fillRect(0, 300, 512, 212);
      ctx.strokeStyle = 'rgba(35,31,28,.48)'; ctx.lineWidth = 2;
      for (const start of [[92,65],[354,188],[241,304]]) {
        ctx.beginPath(); ctx.moveTo(...start);
        for (let i = 0; i < 7; i++) ctx.lineTo(start[0] + (rand()-.5)*36, start[1] + i*23);
        ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace; texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 1); texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }
    function woodTexture() {
      const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#392d24'; ctx.fillRect(0,0,512,512);
      let seed = 91; const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967296; };
      const plank = 64;
      for (let i=0;i<8;i++) {
        const x=i*plank;
        ctx.fillStyle = i%3===0 ? '#4b3a2d' : i%3===1 ? '#3d3027' : '#46362a';
        ctx.fillRect(x+2,0,plank-4,512);
        ctx.strokeStyle='rgba(14,12,10,.48)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,512);ctx.stroke();
        for(let k=0;k<34;k++) {
          const y=rand()*512;
          ctx.strokeStyle=`rgba(${rand()>.5?'154,124,88':'15,13,11'},${.04+rand()*.13})`;
          ctx.lineWidth=1+rand()*2;ctx.beginPath();ctx.moveTo(x+5,y);ctx.bezierCurveTo(x+19,y-8,x+43,y+9,x+plank-6,y+rand()*7-3);ctx.stroke();
        }
      }
      for(let y=90;y<512;y+=122){ctx.fillStyle='rgba(18,15,12,.82)';ctx.fillRect(0,y,512,3);}
      for(let i=0;i<140;i++){ctx.fillStyle=`rgba(13,12,10,${.12+rand()*.26})`;ctx.beginPath();ctx.ellipse(rand()*512,rand()*512,2+rand()*12,1+rand()*3,rand(),0,Math.PI*2);ctx.fill();}
      const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
      texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(2,2);
      texture.anisotropy=renderer.capabilities.getMaxAnisotropy();return texture;
    }

    const plaster = new THREE.MeshStandardMaterial({ map: plasterTexture(), color: 0xd0c2a9, roughness: .98 });
    const wood = new THREE.MeshStandardMaterial({ map: woodTexture(), color: 0xb39a78, roughness: .96 });
    const darkWood = new THREE.MeshStandardMaterial({ color: 0x30271f, roughness: .98 });
    const cloth = new THREE.MeshStandardMaterial({ color: 0x625755, roughness: 1 });
    const fadedFrame = new THREE.MeshStandardMaterial({ color: 0x8a7660, roughness: .94 });

    function block(w,h,d,x,y,z,mat,rotation=0) {
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      mesh.position.set(x,y,z);mesh.rotation.y=rotation;mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh;
    }
    function plane(w,h,x,y,z,mat,rotation) {
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
      mesh.position.set(x,y,z);mesh.rotation.set(...rotation);mesh.receiveShadow=true;scene.add(mesh);return mesh;
    }
    // A small, credible old room: worn plaster, water damage, wood boards, open door.
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),wood);floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-1.5);floor.receiveShadow=true;scene.add(floor);
    const ceiling=plane(8,8,0,3.25,-1.5,new THREE.MeshStandardMaterial({color:0x24231f,roughness:1}),[Math.PI/2,0,0]);
    plane(8,3.25,0,1.625,-5.5,plaster,[0,0,0]);
    plane(8,3.25,-4,1.625,-1.5,plaster,[0,Math.PI/2,0]);
    plane(8,3.25,4,1.625,-1.5,plaster,[0,-Math.PI/2,0]);
    // Back wall cut around the doorway.
    block(3.15,3.25,.12,-2.425,1.625,-5.5,plaster);
    block(3.15,3.25,.12,2.425,1.625,-5.5,plaster);
    block(1.7,.83,.12,0,2.835,-5.5,plaster);
    for(const x of [-.83,.83]) {
      block(.14,2.38,.24,x,1.19,-5.42,darkWood);
      block(.055,2.28,.27,x+Math.sign(x)*.11,1.16,-5.42,fadedFrame);
    }
    block(1.8,.14,.24,0,2.38,-5.42,darkWood);
    block(1.7,.07,.25,0,2.29,-5.43,fadedFrame);
    // A half-open, badly repainted door leaf gives the creature a real occlusion edge.
    const doorPivot=new THREE.Group();doorPivot.position.set(-.78,0,-5.36);doorPivot.rotation.y=-1.08;scene.add(doorPivot);
    const door=new THREE.Mesh(new THREE.BoxGeometry(1.52,2.25,.1),wood);door.position.set(.76,1.12,0);door.castShadow=true;door.receiveShadow=true;doorPivot.add(door);
    for(const yy of [.53,1.55]) {
      const panel=new THREE.Mesh(new THREE.BoxGeometry(1.18,.72,.035),darkWood);panel.position.set(.76,yy,-.066);doorPivot.add(panel);
    }
    const knob=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),new THREE.MeshStandardMaterial({color:0x8c7958,metalness:.2,roughness:.65}));
    knob.position.set(1.31,1.08,-.1);doorPivot.add(knob);
    // Quiet set dressing reads as a home before the eye reaches the doorway.
    block(1.5,.44,2.1,-2.25,.4,1.05,darkWood);
    block(1.42,.24,2.02,-2.25,.74,1.05,cloth);
    block(.48,.42,.42,2.1,.21,-1.4,darkWood);
    block(.75,.07,.58,2.1,.46,-1.4,wood);
    for(let i=0;i<4;i++) block(.055,.9,.08,-3.53+i*.22,1.2,-3.2,wood,.08*(i%2?1:-1));
    // Frame and a faded childlike painting; the details sit at the edge of the beam.
    block(.8,.94,.045,-3.82,1.95,-2.8,darkWood);
    block(.68,.82,.02,-3.79,1.95,-2.75,new THREE.MeshStandardMaterial({color:0x80715b,roughness:1}));
    block(.08,.37,.025,-3.85,1.93,-2.73,new THREE.MeshStandardMaterial({color:0x695d54,roughness:1}),-.18);
    block(.24,.21,.025,-3.7,1.72,-2.73,new THREE.MeshStandardMaterial({color:0x756b58,roughness:1}),.12);
    // Dull practical light and low room fill keep the flashlight clearly dominant.
    scene.add(new THREE.HemisphereLight(0x9a9e91,0x241f1b,.36));
    const practical=new THREE.PointLight(0xd6ad79,4.8,8,2);practical.position.set(-2,2.6,-1.8);scene.add(practical);
    const flashlight=new THREE.SpotLight(0xffdfb0,46,20,Math.PI/7,.5,1.25);
    flashlight.position.set(.14,-.15,-.12);flashlight.target.position.set(0,-.08,-6);
    flashlight.castShadow=true;flashlight.shadow.mapSize.set(1024,1024);flashlight.shadow.bias=-.0003;
    camera.add(flashlight,flashlight.target);scene.add(camera);

    const loader=new GLTFLoader();
    const mixers=[];
    function loadModel(file, position, rotationY=0, scale=1) {
      loader.load(`/art/prefabs/${file}`,gltf=>{
        const model=gltf.scene;model.position.set(...position);model.rotation.y=rotationY;model.scale.setScalar(scale);
        model.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true;}});
        scene.add(model);
        if(gltf.animations.length){const mixer=new THREE.AnimationMixer(model);mixer.clipAction(gltf.animations[0]).play();mixers.push(mixer);}
      });
    }
    // The cat peers from the dark room; the doll and chair tie it to a believable home.
    loadModel('patchwork-watcher-cat.glb',[.52,0,-5.14],Math.PI,.9);
    loadModel('sewn-nursery-doll.glb',[-2.25,.87,1.02],.4,.8);
    loadModel('crooked-dining-chair.glb',[2.05,0,-1.25],0,.96);

    const vhs=createVhsEffect(renderer,scene,camera);vhs.setIntensity(.5);vhs.setFlashlight(true);vhs.resize(innerWidth,innerHeight);
    window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);vhs.resize(innerWidth,innerHeight);});
    let previous=performance.now();
    renderer.setAnimationLoop(now=>{
      const dt=Math.min((now-previous)/1000,.05);previous=now;
      controls.update();for(const mixer of mixers)mixer.update(dt);
      vhs.render(now/1000);
    });
  </script>
</body>
</html>
