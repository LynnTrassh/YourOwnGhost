<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦境室内 · 房间组合预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#10120f;color:#e5dfd0;font:14px/1.6 system-ui}header{position:fixed;top:0;left:0;right:0;z-index:2;background:#151815e8;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px;margin:0}select,button,a{font:inherit;color:inherit;background:#303730;border:1px solid #596053;padding:7px 10px;border-radius:4px;text-decoration:none}canvas{display:block}#status{position:fixed;bottom:20px;left:24px;background:#151815d9;padding:8px 12px;pointer-events:none}
</style></head><body><header><h1>房间组合预览</h1><select id="theme" aria-label="房间主题"><option value="bedroom">旧卧室</option><option value="parlor">空客厅</option><option value="nursery">旧育儿室</option><option value="clinic">诊疗室</option><option value="archive">旧档案室</option><option value="shrine">供奉室</option></select><button id="turn">换个朝向</button><label><input type="checkbox" id="flash" checked>手电筒</label><a href="preview.html">单件模型</a><a href="/">进入游戏</a></header><div id="status" role="status">加载房间…</div><script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createWorld } from '/src/world.js';
import { generatePlan } from '/src/planning/generate.js';
import { createState } from '/src/state.js';
import { configureInteriorFlashlight } from '/src/art/interior-lighting.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1025;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111916);scene.fog=new THREE.Fog(0x111916,9,24);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,80);scene.add(camera);
const flashlight=new THREE.SpotLight();configureInteriorFlashlight(flashlight);flashlight.angle=.38;flashlight.castShadow=true;flashlight.shadow.mapSize.set(1024,1024);flashlight.position.set(.15,-.12,-.12);flashlight.target.position.set(0,-.08,-5);camera.add(flashlight,flashlight.target);
const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=.2;controls.maxDistance=4;controls.maxPolarAngle=Math.PI*.8;
const status=document.querySelector('#status');let lastStatus=0;let world,state,room,angle=0,sequence=0;
async function load(){const current=++sequence;if(world)world.dispose();const theme=document.querySelector('#theme').value;const plan=generatePlan('42',{catEnabled:false,contentIds:[],roomPresetOverrides:{'room-1':theme}});world=createWorld(scene,plan);state=createState(plan);room=plan.rooms.find(r=>r.id===(theme==='bedroom'?'bedroom':'room-1'));angle=0;view();delete status.dataset.summary;status.textContent='加载模型与材质…';await world.artReady;if(current!==sequence)return;let batches={before:0,after:0},walls={before:0,after:0};scene.traverse(n=>{if(n.userData.wallBatchStats)batches=n.userData.wallBatchStats;if(n.userData.wallMaterialBatchStats)walls=n.userData.wallMaterialBatchStats;});status.dataset.summary=`墙面批次 ${walls.before}→${walls.after} / 墙饰 ${batches.before}→${batches.after} · 已加载 ${world.artStats.loaded} 个模型实例 · ${world.artStats.failed.length} 个失败 · 游戏同源房间 / 曝光 +5% · 拖拽环顾，滚轮缩放`;}
function view(){const x=room.center[0]*5,z=room.center[1]*5;camera.position.set(x,1.55,z);const objects=world.plan.obstacles.filter(o=>o.roomId===room.id);const nearest=objects.sort((a,b)=>Math.hypot((a.minX+a.maxX)/2-x,(a.minZ+a.maxZ)/2-z)-Math.hypot((b.minX+b.maxX)/2-x,(b.minZ+b.maxZ)/2-z))[0];const theta=nearest?Math.atan2((nearest.minX+nearest.maxX)/2-x,(nearest.minZ+nearest.maxZ)/2-z):0;controls.target.set(x+Math.sin(theta+angle)*2,1.2,z+Math.cos(theta+angle)*2);controls.update();state.player.x=x;state.player.z=z;world.update(0,state);}
document.querySelector('#theme').addEventListener('change',load);document.querySelector('#turn').addEventListener('click',()=>{angle+=Math.PI/2;view();});document.querySelector('#flash').addEventListener('change',e=>{flashlight.visible=e.target.checked;});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{if(document.hidden)return;controls.update();if(world){state.player.x=camera.position.x;state.player.z=camera.position.z;world.update(0,state);}renderer.render(scene,camera);if(performance.now()-lastStatus>1000&&status.dataset.summary){lastStatus=performance.now();status.textContent=status.dataset.summary+` · 当前 ${renderer.info.render.calls} 次绘制 / ${Math.round(renderer.info.render.triangles/1000)}k 三角面`;} });load().catch(e=>{status.textContent=e.message;console.error(e);});
</script></body></html>
