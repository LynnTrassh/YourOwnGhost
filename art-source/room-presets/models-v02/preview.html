<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦境室内 · 模型预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b1e1c;color:#e5dfd0;font:14px/1.6 system-ui,sans-serif}header{position:fixed;inset:0 0 auto;padding:18px 24px;z-index:2;background:#1b1e1cf0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}select,button,a{background:#303730;border:1px solid #596053;color:#e7dfce;padding:7px 10px;border-radius:4px;text-decoration:none;font:inherit}#status{position:fixed;bottom:18px;left:24px;right:24px;color:#c0c4b8;z-index:2}#viewport{position:fixed;inset:90px 0 50px}canvas{display:block}button{cursor:pointer}@media(max-width:700px){#viewport{top:165px}header{gap:7px}}
</style></head><body><header><h1>梦境室内模型</h1><select id="asset" aria-label="模型"></select><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><select id="light" aria-label="预览灯光"><option value="neutral">中性检查光</option><option value="room">房间暖光</option></select><a href="scene-preview.html">房间组合预览</a><a href="/" target="_blank">进入游戏场景</a><button id="refresh">刷新资产列表</button></header><main id="viewport"></main><div id="status" role="status">读取已导出模型…</div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const viewport=document.querySelector('#viewport'),status=document.querySelector('#status'),select=document.querySelector('#asset');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(viewport.clientWidth,viewport.clientHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;viewport.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#1b1e1c');
const camera=new THREE.PerspectiveCamera(38,viewport.clientWidth/viewport.clientHeight,.01,60);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const hemi=new THREE.HemisphereLight(0xe8e8e0,0x483c2e,1.6),key=new THREE.DirectionalLight(0xffedd5,3.4),fill=new THREE.DirectionalLight(0x9cb4d0,1.2);key.position.set(-3,5,-4);fill.position.set(3,3,3);scene.add(hemi,key,fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x34372e,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.006;scene.add(floor);
const grid=new THREE.GridHelper(6,12,0x565b4b,0x41463c);grid.position.y=-.003;scene.add(grid);
let catalog,model,serial=0,size=new THREE.Vector3(1,2,1),view='front';
const names={'furniture-bed-single':'单人床','furniture-nightstand':'床头柜','furniture-dresser':'斗柜','furniture-wardrobe':'衣柜','furniture-bookcase':'书柜','furniture-sofa-two-seat':'双人沙发','furniture-coffee-table':'茶几','furniture-display-cabinet':'陈列柜','furniture-toy-chest':'玩具箱','furniture-child-table':'儿童桌','furniture-toy-shelf':'玩具架','furniture-examination-cot':'诊疗床','furniture-instrument-trolley':'器械推车','furniture-medicine-cabinet':'药柜','furniture-medical-file-cabinet':'病历柜','furniture-writing-desk':'书桌','furniture-document-table':'文件桌','furniture-archive-shelf':'档案架','furniture-multi-drawer-file-cabinet':'多抽档案柜','furniture-offering-table':'供桌','furniture-kneeling-bench':'跪凳','furniture-shrine-cabinet':'供柜','furniture-armchair-curved':'曲木扶手椅','furniture-dining-chair':'木椅','lighting-table-lamp':'布罩台灯','lighting-floor-lamp':'落地灯','lighting-strip-double':'双管排灯','lighting-chandelier-three-arm':'三臂吊灯','lighting-wall-sconce':'壁灯','lighting-pendant-bare-bulb':'裸灯泡吊灯','lighting-desk-lamp-green':'绿罩书桌灯','fixture-curtain-oxblood-velvet':'暗红丝绒窗帘','architecture-door-panelled':'镶板木门','fixture-radiator-cast-iron':'铸铁暖气片','fixture-mirror-aged':'旧镜子','architecture-window-four-pane':'四格窗'};
function frame(which=view){view=which;const distance=1.25*Math.max(size.y,Math.max(size.x,size.z)/camera.aspect)/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))+Math.max(size.x,size.z)/2;camera.position.set(...({front:[0,size.y*.6,-distance],side:[distance,size.y*.6,0],back:[0,size.y*.6,distance]})[view]);controls.target.set(0,size.y*.5,0);controls.update();}
function dispose(object){const objects=new Set();object.traverse(n=>{if(n.isMesh){objects.add(n.geometry);for(const m of [n.material].flat()){objects.add(m);for(const t of Object.values(m))if(t?.isTexture)objects.add(t);}}});for(const o of objects)o.dispose();object.removeFromParent();}
async function show(){const ticket=++serial,asset=catalog.models.find(a=>a.id===select.value);if(!asset)return;status.textContent='加载 '+(names[asset.id]??asset.id)+'…';try{const gltf=await new GLTFLoader().loadAsync(asset.runtimeUrl);if(ticket!==serial){dispose(gltf.scene);return;}if(model)dispose(model);model=gltf.scene;scene.add(model);size=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());frame();let tris=0;model.traverse(n=>{if(n.isMesh)tris+=(n.geometry.index?.count??n.geometry.attributes.position.count)/3;});status.textContent=`已导出 ${catalog.models.length}/36 件 · ${asset.id} · ${Math.round(tris)} 三角面 · ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m · 拖拽旋转 / 滚轮缩放`;document.body.dataset.modelLoaded=asset.id;requestRender();}catch(e){status.textContent='加载失败：'+e.message;console.error(e);}}
async function refresh(){const old=select.value;catalog=await fetch('/art/room-presets/v02/manifest.json',{cache:'no-store'}).then(r=>r.json());select.replaceChildren(...catalog.models.map(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=names[a.id]??a.id;return o;}));if(catalog.models.some(a=>a.id===old))select.value=old;else select.value=catalog.models.find(a=>a.id==='furniture-wardrobe')?.id??catalog.models[0]?.id;await show();}
select.addEventListener('change',show);document.querySelector('#refresh').addEventListener('click',refresh);for(const id of ['front','side','back'])document.querySelector('#'+id).addEventListener('click',()=>frame(id));document.querySelector('#light').addEventListener('change',e=>{const room=e.target.value==='room';hemi.intensity=room?.4:1.6;key.intensity=room?2.8:3.4;key.color.set(room?0xffc084:0xffedd5);fill.intensity=room?.4:1.2;requestRender();});addEventListener('resize',()=>{camera.aspect=viewport.clientWidth/viewport.clientHeight;camera.updateProjectionMatrix();renderer.setSize(viewport.clientWidth,viewport.clientHeight);frame();});let renderPending=false;function requestRender(){if(renderPending||document.hidden)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;controls.update();renderer.render(scene,camera);});}controls.addEventListener('change',requestRender);addEventListener('visibilitychange',requestRender);requestRender();refresh().catch(e=>{status.textContent=e.message;});
</script></body></html>
