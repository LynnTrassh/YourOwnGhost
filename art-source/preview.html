<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Own Ghost · prefab preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #d6d0c1; background: #11110f; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    header { position: fixed; z-index: 2; top: 0; left: 0; padding: 16px 20px; display: flex; align-items: center; gap: 14px; letter-spacing: .12em; text-transform: uppercase; }
    select { color: #d6d0c1; background: #22221f; border: 1px solid #59564c; padding: 8px 10px; font: inherit; letter-spacing: 0; }
    #caption { position: fixed; left: 20px; bottom: 18px; color: #aaa596; letter-spacing: .04em; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <header><span>YOUR OWN GHOST · PREFAB STUDY</span>
    <select id="asset" aria-label="预制体">
      <option value="patchwork-watcher-cat.glb">Patchwork watcher · cat</option>
      <option value="sewn-nursery-doll.glb">Sewn nursery doll</option>
      <option value="crooked-dining-chair.glb">Crooked dining chair</option>
    </select>
  </header>
  <div id="caption">拖拽旋转 · 滚轮缩放 · 演示 GLB 自带的缓慢待机动画</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.shadowMap.enabled = true;
    document.body.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#11110f');
    scene.fog = new THREE.Fog('#11110f', 7, 15);
    const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, .05, 50);
    camera.position.set(2.5, 1.9, -3.8);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, .88, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.1;
    controls.maxDistance = 8;

    scene.add(new THREE.HemisphereLight(0xc1c4b4, 0x302924, .62));
    const key = new THREE.SpotLight(0xffd7a2, 34, 12, Math.PI / 6, .58, 1.25);
    key.position.set(-2.2, 4.4, -2.3);
    key.target.position.set(0, .7, 0);
    scene.add(key, key.target);
    const fill = new THREE.PointLight(0x8b9ba2, 1.6, 7, 2);
    fill.position.set(2, 1.5, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x302b25, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -.015;
    floor.receiveShadow = true;
    scene.add(floor);
    const loader = new GLTFLoader();
    const picker = document.querySelector('#asset');
    let activeRoot = null;
    let mixer = null;
    let previous = performance.now();

    function loadAsset(filename) {
      if (activeRoot) {
        scene.remove(activeRoot);
        activeRoot.traverse(node => {
          if (!node.isMesh) return;
          node.geometry.dispose();
          if (Array.isArray(node.material)) node.material.forEach(material => material.dispose());
          else node.material.dispose();
        });
      }
      mixer = null;
      loader.load(`/art/prefabs/${filename}`, gltf => {
        activeRoot = gltf.scene;
        activeRoot.traverse(node => {
          if (!node.isMesh) return;
          node.castShadow = true;
          node.receiveShadow = true;
        });
        scene.add(activeRoot);
        if (gltf.animations.length) {
          mixer = new THREE.AnimationMixer(activeRoot);
          mixer.clipAction(gltf.animations[0]).play();
        }
        controls.target.set(0, filename.includes('chair') ? .45 : filename.includes('doll') ? .47 : .9, 0);
      });
    }
    picker.addEventListener('change', () => loadAsset(picker.value));
    loadAsset(picker.value);
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(now => {
      const dt = Math.min((now - previous) / 1000, .05);
      previous = now;
      mixer?.update(dt);
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
